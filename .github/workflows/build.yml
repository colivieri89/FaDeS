name: Build installers

# Installers for macOS (dmg, Apple Silicon and Intel) and Windows (exe). Started by hand (Actions, Run workflow) it
# only builds them; on a tag v* (for example v1.0.0) it also publishes them as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  installers:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            files: dist/*.dmg
            name: macOS
          - os: windows-latest
            script: dist:win
            files: dist/*.exe
            name: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no certificate: ad-hoc signature on macOS (package.json), none on Windows
      - uses: actions/upload-artifact@v4
        with:
          name: Facade-Debris-Simulator-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    # on a tag v*, attach the installers to a GitHub release of that tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
